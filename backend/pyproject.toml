[project]
name = "polyscoop-backend"
version = "0.1.0"
description = "polyscoop – Polymarket data dashboard backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "pydantic-settings",
    "httpx",
    "curl_cffi>=0.14",
    "python-jose[cryptography]",
    "bcrypt",
    "pydantic[email]",
    "py-clob-client",
    "python-dotenv",
    "ruff",
    "pyright",
    "pytest",
    "asyncpg",
    "sqlalchemy[asyncio]",
    "alembic",
    "redis[hiredis]",
    "websockets",
    "psycopg2-binary>=2.9.11",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ASYNC", "T20"]
ignore = ["B008"]  # Depends() in FastAPI defaults is intentional

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
